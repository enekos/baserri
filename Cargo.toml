[package]
name = "baserri"
version = "0.3.0"
edition = "2024"
description = "Provisioner and Telegram control plane for a Raspberry Pi home server. Two static binaries, zero dependencies."
license = "MIT"
readme = "README.md"
repository = "https://github.com/enekos/baserri"
homepage = "https://github.com/enekos/baserri"
documentation = "https://github.com/enekos/baserri"
keywords = ["raspberry-pi", "provisioning", "telegram", "homelab", "ssh"]
categories = ["command-line-utilities"]
exclude = [".cargo/"]

[lib]
name = "baserri"
path = "src/lib.rs"

[[bin]]
name = "baserri"
path = "src/bin/baserri.rs"

[[bin]]
name = "baserrid"
path = "src/bin/baserrid.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
