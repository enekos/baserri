[package]
name = "baserri"
version = "0.1.0"
edition = "2024"
description = "Provisioner and Telegram control plane for a Raspberry Pi home server"
license = "MIT"

[lib]
name = "baserri"
path = "src/lib.rs"

[[bin]]
name = "baserri"
path = "src/bin/baserri.rs"

[[bin]]
name = "baserrid"
path = "src/bin/baserrid.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
